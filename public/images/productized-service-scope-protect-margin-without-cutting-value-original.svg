<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Clear scope protects useful work</title><desc id="desc">Service package drawn as a defined boundary, with corrections inside and optional additions outside, plus a cost example.</desc><rect width="1200" height="760" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="75" y="100" font-size="43" fill="#17394c">Clear scope protects useful work</text><text x="78" y="146" font-size="20" fill="#17394c">Original editorial illustration • ProfitStackingSecrets</text><rect x="90" y="210" width="565" height="325" rx="16" fill="#dcecdf"/><rect x="90" y="210" width="565" height="325" rx="16" fill="none" stroke="#2d6d4d" stroke-width="6"/><text x="130" y="263" font-size="29" fill="#17394c">AGREED DELIVERABLE</text><rect x="128" y="293" width="486" height="56" rx="16" fill="#ffffff"/><text x="153" y="331" font-size="25" fill="#17394c">Specified work and inputs</text><rect x="128" y="370" width="486" height="56" rx="16" fill="#ffffff"/><text x="153" y="408" font-size="24" fill="#17394c">Corrections + agreed explanation</text><text x="130" y="480" font-size="27" fill="#17394c">Acceptance criteria</text><rect x="770" y="290" width="320" height="160" rx="16" fill="#f5e2ab"/><text x="811" y="342" font-size="26" fill="#17394c">ADDITIONAL WORK</text><text x="813" y="390" font-size="24" fill="#17394c">Quote before starting</text><path d="M660 370 H755 M730 348 L755 370 L730 392" fill="none" stroke="#9a702d" stroke-width="7"/><text x="130" y="625" font-size="31" fill="#17394c">Promise → delivery cost → contribution review</text></g></svg>
