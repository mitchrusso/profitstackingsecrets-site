<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Contribution margin profit ladder</title><desc id="desc">A waterfall-style chart from revenue through variable costs to contribution margin and operating profit.</desc><rect width="1200" height="760" fill="#f4f1ea"/><text x="75" y="95" font-family="Arial" font-size="28" font-weight="700" fill="#19745d">PROFIT STACKING SECRETS</text><text x="75" y="165" font-family="Arial" font-size="52" font-weight="800" fill="#172424">Build a Contribution-Margin Ladder</text><text x="75" y="215" font-family="Arial" font-size="24" fill="#596661">See what each sale contributes before you chase more volume.</text><g font-family="Arial"><rect x="100" y="310" width="210" height="270" rx="18" fill="#19745d"/><text x="205" y="620" text-anchor="middle" font-size="24" font-weight="800" fill="#172424">REVENUE</text><rect x="365" y="390" width="210" height="190" rx="18" fill="#ca6b53"/><text x="470" y="620" text-anchor="middle" font-size="24" font-weight="800" fill="#172424">VARIABLE COSTS</text><rect x="630" y="355" width="210" height="225" rx="18" fill="#63b99d"/><text x="735" y="620" text-anchor="middle" font-size="24" font-weight="800" fill="#172424">CONTRIBUTION</text><rect x="895" y="435" width="210" height="145" rx="18" fill="#8ed9bf"/><text x="1000" y="620" text-anchor="middle" font-size="24" font-weight="800" fill="#172424">OPERATING PROFIT</text><text x="205" y="450" text-anchor="middle" font-size="35" font-weight="800" fill="white">100%</text><text x="470" y="490" text-anchor="middle" font-size="35" font-weight="800" fill="white">− per sale</text><text x="735" y="465" text-anchor="middle" font-size="35" font-weight="800" fill="white">= available</text><text x="1000" y="515" text-anchor="middle" font-size="30" font-weight="800" fill="#172424">after fixed costs</text></g><text x="75" y="690" font-family="Arial" font-size="22" fill="#596661">Use actual bookkeeping data; this guide is educational and does not replace accounting advice.</text></svg>
